services:
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    # No ports mapping needed here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - WS_ADDR=0.0.0.0:8000
      - AXUM_ADDR=0.0.0.0:8081
    # No ports mapping needed here
#    volumes:
#      - ./backend:/app
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - backend
    # No ports mapping needed here
    networks:
      - app_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
